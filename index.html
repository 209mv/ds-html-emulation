<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mauricio's cool hub i guess</title><style>body{margin:0;font-family:Arial,sans-serif;color:white;overflow:hidden;background:black}#space{position:fixed;inset:0;width:100%;height:100%;z-index:-1}header{text-align:center;font-size:28px;padding:20px;text-transform:lowercase}.announcements{max-width:800px;margin:auto;background:rgba(20,20,20,.7);padding:15px;border-radius:10px;backdrop-filter:blur(5px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;max-width:900px;margin:30px auto;padding:10px}.card{background:rgba(30,30,30,.8);padding:20px;border-radius:12px;text-align:center;cursor:pointer;transition:.2s}.card:hover{transform:scale(1.05);background:rgba(50,50,50,.9)}#adminGate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:20}#adminBox{background:#17171b;padding:25px;border-radius:15px;width:min(380px,90vw)}#adminBox input{width:100%;box-sizing:border-box;padding:10px;margin:7px 0}#adminBox button{padding:10px 14px}.hint{font-size:12px;opacity:.7}</style></head><body><canvas id="space"></canvas><header>mauricio's cool hub i guess</header><div class="announcements">📢 ds emulator is now available</div><div class="grid"><div class="card" onclick="location.href='emulators.html'">🧩 emulators</div><div class="card" onclick="location.href='games/index.html'">🎯 games</div><div class="card" onclick="location.href='chat.html'">💬 chat</div></div><div id="adminGate"><div id="adminBox"><h2>Admin Panel</h2><input id="adminPassword" type="password" placeholder="Admin password"><button id="adminLogin">Unlock</button><p id="adminStatus" class="hint"></p></div></div><script>const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');let stars=[],w,h;function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*2+.5})}function draw(){ctx.fillStyle='black';ctx.fillRect(0,0,w,h);ctx.fillStyle='white';for(const s of stars){s.y+=s.z*.3;if(s.y>h){s.y=0;s.x=Math.random()*w}ctx.fillRect(s.x,s.y,s.z,s.z)}requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw();let typed='';let timer;addEventListener('keydown',e=>{if(e.key.length!==1)return;typed+=e.key.toLowerCase();if(typed.length>12)typed=typed.slice(-12);clearTimeout(timer);timer=setTimeout(()=>typed='',2500);if(typed==='mauricio123'){typed='';document.getElementById('adminGate').style.display='flex';document.getElementById('adminPassword').focus()}});document.getElementById('adminLogin').onclick=()=>{const p=document.getElementById('adminPassword').value;const s=document.getElementById('adminStatus');if(p==='10dollars'){s.textContent='Demo unlock only. Server-side admin authorization is required before destructive controls are enabled.'}else s.textContent='Incorrect password.'}</script></body></html>
