<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mauricio's Chat</title><style>body{margin:0;background:#0d0d0f;color:#fff;font-family:Arial,sans-serif}.app{display:flex;height:100vh}.sidebar{width:220px;background:#111;padding:10px;overflow:auto}.main{flex:1;display:flex;flex-direction:column}#chatbox{flex:1;overflow:auto;padding:10px}.msg{margin:6px 0;padding:10px;background:#1e1e22;border-radius:10px}.input-area{display:flex;padding:10px;background:#111;gap:8px}.input-area input{flex:1;padding:10px}.top{padding:10px;background:#151518;display:flex;justify-content:space-between}.banner{padding:10px;background:#25252b;display:none}.auth{position:fixed;inset:0;background:#08080a;display:grid;place-items:center;z-index:10}.auth form{width:min(360px,90vw);padding:24px;background:#17171b;border-radius:14px}.auth input{box-sizing:border-box;width:100%;padding:11px;margin:6px 0}.auth button{padding:10px 14px;margin-top:8px}.muted{opacity:.7;font-size:12px}</style></head><body><div id="auth" class="auth"><form id="authForm"><h2>Chat account</h2><input id="username" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button type="submit">Sign in / create account</button><p id="authStatus" class="muted"></p></form></div><div class="app"><aside class="sidebar"><h3>People</h3><div id="users"></div></aside><main class="main"><div class="top"><b>Global Chat</b><span id="me"></span></div><div id="banner" class="banner"></div><div id="chatbox"></div><div class="input-area"><input id="msgInput" maxlength="500" placeholder="message..." disabled><button id="send" disabled>Send</button></div></main></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getDatabase,ref,push,onValue,set,get,query,limitToLast}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyDJeELWu4UC3eESgGZNvjkHeDRxgPqjLs8',authDomain:'mauricios-arcade.firebaseapp.com',databaseURL:'https://mauricios-arcade-default-rtdb.firebaseio.com',projectId:'mauricios-arcade',storageBucket:'mauricios-arcade.firebasestorage.app',messagingSenderId:'46092206799',appId:'1:46092206799:web:caebd3ea590a9bcdf86dba',measurementId:'G-FXVYE3GHDM'};const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);let user=null,profile=null,isMuted=false,isBlocked=false;
const severe=[/n[\W_]*i[\W_]*g[\W_]*g[\W_]*e[\W_]*r/iu,/n[\W_]*i[\W_]*g[\W_]*g[\W_]*a/iu];const profanity=[/fuck/iu,/shit/iu,/bitch/iu,/asshole/iu];function moderate(text){let n=text.normalize('NFKC').toLowerCase().replace(/[\u200b-\u200f\u202a-\u202e]/g,'');if(severe.some(r=>r.test(n)))return{ok:false,text:''};let out=text;for(const r of profanity)out=out.replace(r,m=>'*'.repeat(m.length));return{ok:true,text:out}}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function accountEmail(n){return n.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'_')+'@users.mauriciosarcade.local'}
async function authenticate(n,p){const email=accountEmail(n);try{return(await signInWithEmailAndPassword(auth,email,p)).user}catch(e){if(e.code==='auth/invalid-credential'||e.code==='auth/user-not-found')return(await createUserWithEmailAndPassword(auth,email,p)).user;throw e}}
document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const n=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(n.length<3||n.length>24){document.getElementById('authStatus').textContent='Username must be 3–24 characters.';return}if(p.length<6){document.getElementById('authStatus').textContent='Password must be at least 6 characters.';return}document.getElementById('authStatus').textContent='Signing in…';try{await authenticate(n,p);localStorage.setItem('chatUsername',n)}catch(err){document.getElementById('authStatus').textContent=err.message}});
onAuthStateChanged(auth,async u=>{if(!u)return;user=u;const name=localStorage.getItem('chatUsername')||u.email.split('@')[0],r=ref(db,'users/'+u.uid),snap=await get(r);if(!snap.exists()){await set(r,{name});await set(ref(db,'publicProfiles/'+u.uid),{name})}onValue(r,s=>{profile=s.val()||{};isMuted=!!profile.muted;isBlocked=Number(profile.blockedUntil||0)>Date.now();if(profile.banned||isBlocked){document.body.innerHTML='<div style="padding:30px;font-family:Arial"><h1>Access blocked</h1><p>'+ (profile.banned?'Your account has been banned.':'Your access is temporarily blocked.')+'</p>'+(isBlocked?'<p>Try again after '+new Date(Number(profile.blockedUntil)).toLocaleString()+'.</p>':'')+'</div>';return}document.getElementById('me').textContent='@'+safe(profile.name);document.getElementById('auth').style.display='none';document.getElementById('msgInput').disabled=false;document.getElementById('send').disabled=false});loadMessages();loadUsers();loadBanner()});
async function sendMsg(){if(!user||isMuted||isBlocked)return;const input=document.getElementById('msgInput'),raw=input.value.trim();if(!raw)return;const result=moderate(raw);if(!result.ok){input.value='';alert('That message was blocked by the chat filter.');return}await push(ref(db,'messages'),{text:result.text,userId:user.uid,name:profile.name,time:Date.now()});input.value=''}document.getElementById('send').onclick=sendMsg;document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});function loadMessages(){onValue(query(ref(db,'messages'),limitToLast(100)),snap=>{const box=document.getElementById('chatbox');box.innerHTML='';snap.forEach(c=>{const m=c.val(),div=document.createElement('div');div.className='msg';div.innerHTML='<b>'+safe(m.name)+'</b><div>'+safe(m.text)+'</div>';box.appendChild(div)});box.scrollTop=box.scrollHeight})}function loadUsers(){onValue(ref(db,'publicProfiles'),snap=>{const box=document.getElementById('users');box.innerHTML='';snap.forEach(c=>{const d=c.val(),el=document.createElement('div');el.textContent='@'+(d.name||'user');el.style.padding='6px 0';box.appendChild(el)})})}function loadBanner(){onValue(ref(db,'site/banner'),s=>{const b=document.getElementById('banner'),v=s.val();b.textContent=v?.text||'';b.style.display=v?.text?'block':'none'})}
</script></body></html>
