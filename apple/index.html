<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>body{margin:0;background:#09090b;color:#fff;font-family:Arial,sans-serif}main{max-width:900px;margin:30px auto;padding:20px}.card{background:#151518;border:1px solid #29292f;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button,select{box-sizing:border-box;padding:10px;margin:5px 0;background:#0e0e10;color:#fff;border:1px solid #333;border-radius:8px}input,textarea,select{width:100%}button{cursor:pointer}#panel{display:none}.danger{border-color:#6b2020}.status{min-height:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style></head><body><main>
<div id="login" class="card"><h1>Admin Panel</h1><p>Authorized access only.</p><input id="pw" type="password" placeholder="Admin password"><button id="loginBtn">Unlock</button><div id="loginStatus" class="status"></div></div>
<section id="panel"><h1>🛠 Mauricio's Admin Panel</h1><p>Admin controls for the site.</p>
<div class="card"><h2>Global announcement</h2><textarea id="announcement" maxlength="500" placeholder="Announcement text"></textarea><button id="sendAnnouncement">Publish banner</button><button id="clearAnnouncement">Clear banner</button></div>
<div class="card danger"><h2>Game availability</h2><label>Shutdown message</label><input id="shutdownMessage" maxlength="300" placeholder="Games are temporarily unavailable."><label><input id="gamesDown" type="checkbox" style="width:auto"> Disable games</label><br><button id="saveShutdown">Save game status</button></div>
<div class="card"><h2>Chat moderation</h2><p>Use Firebase user records to mute or ban accounts. The chat page already watches these fields.</p><input id="targetUid" placeholder="User UID"><div class="row"><button id="muteUser">Toggle mute</button><button id="banUser">Toggle ban</button></div><button id="resetUser">Reset mute + ban</button></div>
<div class="card"><h2>System status</h2><pre id="status">Loading…</pre></div>
</section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';import{getDatabase,ref,get,set}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js';
const firebaseConfig={apiKey:'YOUR_API_KEY',authDomain:'mauricio-chat.firebaseapp.com',databaseURL:'https://mauricio-chat-default-rtdb.firebaseio.com',projectId:'mauricio-chat'};const app=initializeApp(firebaseConfig),db=getDatabase(app);const ADMIN_PASSWORD='10dollars';
const $=id=>document.getElementById(id);function out(t){$('status').textContent=t}function requireLogin(){if(sessionStorage.adminUnlocked!=='1')return false;return true}
$('loginBtn').onclick=()=>{if($('pw').value===ADMIN_PASSWORD){sessionStorage.adminUnlocked='1';$('login').style.display='none';$('panel').style.display='block';load()}else $('loginStatus').textContent='Incorrect password.'};
async function load(){const[b,g]=await Promise.all([get(ref(db,'site/banner')),get(ref(db,'site/games'))]);$('announcement').value=b.val()?.text||'';$('gamesDown').checked=!!g.val()?.disabled;$('shutdownMessage').value=g.val()?.message||'';out('Connected. '+new Date().toLocaleString())}
$('sendAnnouncement').onclick=async()=>{if(!requireLogin())return;const text=$('announcement').value.trim();await set(ref(db,'site/banner'),{text,updatedAt:Date.now()});out('Announcement published.')};$('clearAnnouncement').onclick=async()=>{await set(ref(db,'site/banner'),{text:'',updatedAt:Date.now()});$('announcement').value='';out('Banner cleared.')};$('saveShutdown').onclick=async()=>{await set(ref(db,'site/games'),{disabled:$('gamesDown').checked,message:$('shutdownMessage').value.trim(),updatedAt:Date.now()});out('Game status saved.')};
$('muteUser').onclick=async()=>toggle('muted');$('banUser').onclick=async()=>toggle('banned');$('resetUser').onclick=async()=>{const id=$('targetUid').value.trim();if(!id)return;await set(ref(db,'users/'+id+'/muted'),false);await set(ref(db,'users/'+id+'/banned'),false);out('User reset.')};async function toggle(field){const id=$('targetUid').value.trim();if(!id)return;const r=ref(db,'users/'+id+'/'+field),s=await get(r);await set(r,!s.val());out(field+' updated.')}
if(requireLogin()){$('login').style.display='none';$('panel').style.display='block';load()}
</script></body></html>
