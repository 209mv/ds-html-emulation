<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><style>body{margin:0;background:#09090b;color:#fff;font-family:Arial,sans-serif}main{max-width:1000px;margin:30px auto;padding:20px}.card{background:#151518;border:1px solid #29292f;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button,select{box-sizing:border-box;padding:10px;margin:5px 0;background:#0e0e10;color:#fff;border:1px solid #333;border-radius:8px}input,textarea,select{width:100%}button{cursor:pointer}.danger{border-color:#6b2020}.status{min-height:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #29292f;text-align:left;font-size:13px}.ok{color:#8f8}.bad{color:#f88}</style></head><body><main>
<div id="login" class="card"><h1>Admin Panel</h1><p>The secret URL is only a shortcut. Firebase decides whether the account is an administrator.</p><input id="username" placeholder="Admin username" autocomplete="username"><input id="password" type="password" placeholder="Admin account password" autocomplete="current-password"><input id="gate" type="password" placeholder="Panel code (10dollars)"><button id="loginBtn">Sign in</button><div id="loginStatus" class="status"></div></div>
<section id="panel" style="display:none"><h1>🛠 Mauricio's Admin Panel</h1><p id="adminIdentity"></p><div class="card"><h2>Global announcement</h2><textarea id="announcement" maxlength="500" placeholder="Announcement text"></textarea><button id="sendAnnouncement">Publish banner</button><button id="clearAnnouncement">Clear banner</button></div><div class="card danger"><h2>Game availability</h2><input id="shutdownMessage" maxlength="300" placeholder="Games are temporarily unavailable."><label><input id="gamesDown" type="checkbox" style="width:auto"> Disable games</label><br><button id="saveShutdown">Save game status</button></div><div class="card"><h2>Chat moderation</h2><input id="targetUid" placeholder="User UID"><select id="blockDuration"><option value="0">No temporary block</option><option value="300000">5 minutes</option><option value="900000">15 minutes</option><option value="3600000">1 hour</option><option value="86400000">24 hours</option></select><input id="reason" maxlength="200" placeholder="Reason (optional)"><div class="row"><button id="warnUser">Issue warning</button><button id="muteUser">Toggle mute</button></div><div class="row"><button id="banUser">Toggle permanent ban</button><button id="blockUser">Temporarily block website</button></div><button id="resetUser">Clear mute/ban/block</button></div><div class="card"><h2>Moderation logs</h2><div style="overflow:auto"><table><thead><tr><th>Time</th><th>Action</th><th>User</th><th>Reason</th></tr></thead><tbody id="logs"></tbody></table></div></div><div class="card"><h2>System status</h2><pre id="status">Waiting for authentication…</pre></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js';import{getDatabase,ref,get,set,push,onValue}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js';
const firebaseConfig={apiKey:'YOUR_API_KEY',authDomain:'mauricio-chat.firebaseapp.com',databaseURL:'https://mauricio-chat-default-rtdb.firebaseio.com',projectId:'mauricio-chat'};const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);const $=id=>document.getElementById(id),PANEL_CODE='10dollars';let admin=false;
function emailForName(n){return n.trim().toLowerCase().replace(/[^a-z0-9._-]/g,'_')+'@users.mauriciosarcade.local'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function out(t){$('status').textContent=t;$('status').className='ok'}
$('loginBtn').onclick=async()=>{const n=$('username').value.trim(),p=$('password').value;if($('gate').value!==PANEL_CODE){$('loginStatus').textContent='Incorrect panel code.';return}try{await signInWithEmailAndPassword(auth,emailForName(n),p)}catch(e){$('loginStatus').textContent='Sign-in failed. Use the Firebase account that was promoted to admin.'}};
onAuthStateChanged(auth,async u=>{if(!u)return;const s=await get(ref(db,'admins/'+u.uid));if(s.val()!==true){admin=false;$('loginStatus').textContent='Authenticated, but this account is not an administrator.';return}admin=true;$('login').style.display='none';$('panel').style.display='block';$('adminIdentity').textContent='Signed in securely as '+u.uid;load()});
async function load(){const[b,g]=await Promise.all([get(ref(db,'site/banner')),get(ref(db,'site/games'))]);$('announcement').value=b.val()?.text||'';$('gamesDown').checked=!!g.val()?.disabled;$('shutdownMessage').value=g.val()?.message||'';onValue(ref(db,'moderationLogs'),snap=>{const rows=[];snap.forEach(c=>rows.push(c.val()));rows.reverse();$('logs').innerHTML=rows.map(x=>'<tr><td>'+new Date(x.time).toLocaleString()+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.userId)+'</td><td>'+esc(x.reason)+'</td></tr>').join('')});out('Secure admin session active.')}
async function log(action,userId,reason){if(!admin)return;await push(ref(db,'moderationLogs'),{action,userId:userId||'',reason:reason||'',time:Date.now(),moderator:auth.currentUser.uid})}
$('sendAnnouncement').onclick=async()=>{await set(ref(db,'site/banner'),{text:$('announcement').value.trim(),updatedAt:Date.now()});out('Announcement published.')};$('clearAnnouncement').onclick=async()=>{await set(ref(db,'site/banner'),{text:'',updatedAt:Date.now()});$('announcement').value='';out('Banner cleared.')};$('saveShutdown').onclick=async()=>{await set(ref(db,'site/games'),{disabled:$('gamesDown').checked,message:$('shutdownMessage').value.trim(),updatedAt:Date.now()});out('Game status saved.')};$('warnUser').onclick=async()=>{const id=$('targetUid').value.trim();if(!id)return;await push(ref(db,'users/'+id+'/warnings'),{reason:$('reason').value.trim(),time:Date.now()});await log('warning',id,$('reason').value.trim());out('Warning recorded.')};$('muteUser').onclick=async()=>toggle('muted');$('banUser').onclick=async()=>toggle('banned');$('blockUser').onclick=async()=>{const id=$('targetUid').value.trim(),d=Number($('blockDuration').value);if(!id||!d)return;const until=Date.now()+d;await set(ref(db,'users/'+id+'/blockedUntil'),until);await log('temporary block',id,$('reason').value.trim()||('Until '+new Date(until).toLocaleString()));out('Temporary block saved.')};$('resetUser').onclick=async()=>{const id=$('targetUid').value.trim();if(!id)return;await set(ref(db,'users/'+id+'/muted'),false);await set(ref(db,'users/'+id+'/banned'),false);await set(ref(db,'users/'+id+'/blockedUntil'),0);await log('reset moderation',id,$('reason').value.trim());out('Moderation state reset.')};async function toggle(field){const id=$('targetUid').value.trim();if(!id)return;const r=ref(db,'users/'+id+'/'+field),s=await get(r),next=!s.val();await set(r,next);await log(next?'set '+field:'clear '+field,id,$('reason').value.trim());out(field+' updated.')}
</script></body></html>
