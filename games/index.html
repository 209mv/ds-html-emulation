<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>games</title><link rel="stylesheet" href="../space.css"><style>html,body{margin:0;padding:0;min-height:100%;overflow-y:auto;font-family:Arial,sans-serif;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;max-width:900px;margin:30px auto;padding:10px}.card{background:rgba(30,30,30,.85);padding:15px;border-radius:12px;text-align:center;cursor:pointer;transition:.2s;overflow:hidden}.card:hover{transform:scale(1.05);background:rgba(50,50,50,.9)}.thumb,.game-icon{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#111}.game-icon{display:flex;align-items:center;justify-content:center;font-size:42px}.title{font-weight:600}header{text-align:center;font-size:28px;padding:20px;text-transform:lowercase}#search{display:block;margin:0 auto;width:60%;max-width:400px;padding:10px;border-radius:10px;border:none;outline:none;font-size:16px}</style></head><body><canvas id="space"></canvas><header>games</header><input id="search" placeholder="search games..."><div class="grid" id="grid"></div><script src="../space.js"></script><script src="manifest.js"></script><script>const grid=document.getElementById('grid'),search=document.getElementById('search');const ICONS={'10 Minutes Till Dawn':'🌙','12 Mini Battles':'⚔️','1v1 Soccer':'⚽','1v1 Tennis':'🎾','2048':'🔢','3D Flight Simulator':'✈️','8 Ball Classic':'🎱','Agar.io Lite':'🟢','Age of War':'⚔️','Among Us':'🚀','Angry Birds':'🐦','Awesome Tanks':'💥','Backrooms':'🚪','Bad Ice Cream':'🍦',"Baldi's Basics":'📚','Basketball Legends':'🏀','BitLife':'👤','Bloons TD':'🎈','Bloxorz':'🟫','Bowmasters':'🏹','Bubble Shooter':'🫧','Candy Crush':'🍬','Capybara Clicker':'🦫','Chess':'♟️','Cookie Clicker':'🍪','Crossy Road':'🐔','Cut The Rope':'🍬','Doodle Jump':'🟩','Drift Boss':'🏎️','Drift Hunters':'🏎️','Drive Mad':'🚗','Duck Life':'🦆','Earn To Die':'🚙','Escape Road':'🛣️','FNAF':'🐻','Football Bros':'🏈','Football Legends':'🏈','Fruit Ninja':'🍉','Geometry Dash':'🔺','Granny':'👵','Happy Wheels':'🚲','Helix Jump':'🌀','Idle Breakout':'🧱','Jetpack Joyride':'🚀','Minesweeper':'💣','Melon Playground':'🍉','Moto X3M':'🏍️','Pac-Man':'🟡','Paper.io 2':'🟦','Plants vs Zombies':'🌻','Pou':'🟤','Retro Bowl':'🏈','Slope':'🔴','Run':'🏃','Subway Surfers Beijing':'🚇','Subway Surfers Havana':'🚇','Subway Surfers San Francisco':'🚇'};function iconFor(t){const k=Object.keys(ICONS).find(x=>t===x||t.startsWith(x+' '));return ICONS[k]||'🎮'}function render(filter=''){grid.innerHTML='';window.GAME_LIST.filter(g=>g.title.toLowerCase().includes(filter.toLowerCase())).forEach(game=>{const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.className='thumb';img.alt='';img.loading='lazy';img.src='thumbs/'+game.file.replace(/\.(html?|htm)$/i,'')+'.png';const fallback=document.createElement('div');fallback.className='game-icon';fallback.textContent=iconFor(game.title);img.onerror=()=>img.replaceWith(fallback);card.append(img);const title=document.createElement('div');title.className='title';title.textContent=game.title;card.append(title);card.onclick=()=>location.href=game.file;grid.append(card)})}search.addEventListener('input',e=>render(e.target.value));render();</script></body></html>
