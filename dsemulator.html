<!DOCTYPE html>
<html><head><title>mauricio's browser emulators</title><link rel=icon href=docs/favicon.ico sizes="16x16 32x32 48x48 64x64" type=image/vnd.microsoft.icon><meta name=viewport content="width=device-width, initial-scale=1"><style>body,html{height:100%;background:#000;color:#fff}body{margin:0;overflow:hidden}body,#box,#top{display:flex;align-items:center;justify-content:center;flex-direction:column}#box{color:#aaa;height:20em;width:30em;max-width:80%;max-height:80%;background:#333;border-radius:.4em;border:2px solid #555;position:relative;flex-direction:column;transition-duration:.2s;overflow:hidden;font-family:monospace;font-weight:bold;font-size:20px;margin:5px;text-align:center;padding:10px}#box:hover,#box[drag]{border-color:#38f;color:#ddd}#input{cursor:pointer;position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}#display{width:100%;height:100%}select,button{padding:.6em .4em;margin:.5em;width:15em;max-width:100%;font-family:monospace;font-weight:bold;font-size:16px;background:#444;color:#aaa;border-radius:.4em;border:1px solid #555;cursor:pointer;transition-duration:.2s}select:hover,button:hover{background:#666;color:#ddd}.logo{width:130px;height:130px;filter:drop-shadow(0 0 10px white)}#top{margin:5px}</style></head><body><div id=top><h1 id=title>mauricio's browser emulator</h1><img src=docs/Logo-light.png alt=Logo class=logo><br></div><div id=box><input type=file id=input>Load a game file or drag it here</div><script>
let enableDebug=false,enableThreads=false;const urlParams=new URLSearchParams(location.search);const selectedCore=urlParams.get('system')||'';if(parseInt(urlParams.get('debug'))===1||urlParams.get('debug')==='true')enableDebug=true;if(parseInt(urlParams.get('threads'))===1||urlParams.get('threads')==='true')enableThreads=!!window.SharedArrayBuffer;if(selectedCore){const names={nds:'Nintendo DS',gba:'Game Boy Advance',gb:'Game Boy',nes:'NES',snes:'SNES',n64:'Nintendo 64',psx:'PlayStation',segaMD:'Sega Genesis',segaMS:'Sega Master System',segaGG:'Sega Game Gear',arcade:'Arcade',pce:'PC Engine'};document.getElementById('title').textContent=(names[selectedCore]||'Browser')+' emulator';}if(urlParams.get('rom'))run(false,urlParams.get('rom'),selectedCore);async function run(upload,file,forcedCore=''){const url=upload?input.files[0]:`roms/${file}`;const parts=upload?input.files[0].name.split('.') : file.split('.');let core=forcedCore||await(async ext=>{if(['fds','nes','unif','unf'].includes(ext))return'nes';if(['smc','fig','sfc','gd3','gd7','dx2','bsx','swc'].includes(ext))return'snes';if(['z64','n64'].includes(ext))return'n64';if(['pce'].includes(ext))return'pce';if(['ngp','ngc'].includes(ext))return'ngp';if(['ws','wsc'].includes(ext))return'ws';if(['col','cv'].includes(ext))return'coleco';if(['d64'].includes(ext))return'vice_x64sc';if(['nds','gba','gb'].includes(ext))return ext;return await new Promise(resolve=>{const coreValues={'Nintendo 64':'n64','Nintendo Game Boy':'gb','Nintendo Game Boy Advance':'gba','Nintendo DS':'nds','Nintendo Entertainment System':'nes','Super Nintendo Entertainment System':'snes','PlayStation':'psx','Virtual Boy':'vb','Sega Mega Drive':'segaMD','Sega Master System':'segaMS','Sega CD':'segaCD','Atari Lynx':'lynx','Sega 32X':'sega32x','Atari Jaguar':'jaguar','Sega Game Gear':'segaGG','Sega Saturn':'segaSaturn','Atari 7800':'atari7800','Atari 2600':'atari2600','Arcade':'arcade','NEC TurboGrafx-16/SuperGrafx/PC Engine':'pce','NEC PC-FX':'pcfx','SNK NeoGeo Pocket (Color)':'ngp','Bandai WonderSwan (Color)':'ws','ColecoVision':'coleco','Commodore 64':'vice_x64sc','Commodore 128':'vice_x128','Commodore VIC20':'vice_xvic','Commodore Plus/4':'vice_xplus4','Commodore PET':'vice_xpet'};const select=document.createElement('select');Object.keys(coreValues).sort().forEach(type=>{const option=document.createElement('option');option.value=coreValues[type];option.textContent=type;select.appendChild(option)});const button=document.createElement('button');button.textContent='Load game';button.onclick=()=>resolve(select.value);box.innerHTML='';box.append(select,button)})})(parts.pop());const div=document.createElement('div'),sub=document.createElement('div'),script=document.createElement('script');sub.id='game';div.id='display';document.getElementById('top').remove();box.remove();div.appendChild(sub);document.body.appendChild(div);window.EJS_player='#game';window.EJS_gameName=parts.shift()||'game';window.EJS_biosUrl='';window.EJS_gameUrl=url;window.EJS_core=core;window.EJS_pathtodata='emulatorjs/data/';window.EJS_startOnLoaded=true;window.EJS_DEBUG_XX=enableDebug;window.EJS_disableDatabases=true;window.EJS_threads=enableThreads;script.src='emulatorjs/data/loader.js';document.body.appendChild(script)}input.onchange=()=>run(true,null,selectedCore);box.ondragover=()=>box.setAttribute('drag',true);box.ondragleave=()=>box.removeAttribute('drag');</script></body></html>
